name: Build Flutter Web
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Extract zip if needed
        run: |
          mkdir -p extracted
          unzip -q daftari.zip -d extracted || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build Web
        run: |
          cd extracted/*/ || cd extracted || true
          flutter pub get
          flutter build web --release

      - uses: actions/upload-artifact@v3
        with:
          name: github-pages
          path: "**/build/web"
